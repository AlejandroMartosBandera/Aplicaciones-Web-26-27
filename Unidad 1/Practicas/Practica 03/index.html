<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencia de clase</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <img src="Imagenes/IAT-LOGOTIPO.jpg" alt="Logotipo del C.P.I.F.P. Alan Turing">
    </header>

    <main>
        <form action="procesarincidencia.php" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Nueva incidencia</legend>

                <div class="elemento-formulario">
                    <label for="profesor">Profesor *:</label>
                    <input type="text" id="profesor" name="profesor" placeholder="Escribe tu nombre aquí." required>
                </div>

                <div class="elemento-formulario">
                    <label for="correo">Correo electrónico *:</label>
                    <input type="email" id="correo" name="correo" placeholder="Escribe tu correo aquí." required>
                </div>

                <div class="elemento-formulario">
                    <label for="departamento">Departamento *:</label>
                    <select id="departamento" name="departamento" required>
                        <option value="informatica">Informática</option>
                        <option value="administracion">Administración y Gestión</option>
                        <option value="electricidad">Electricidad y Electrónica</option>
                        <option value="sanidad">Sanidad</option>
                        <option value="comercio">Comercio y Marketing</option>
                        <option value="fol">FOL</option>
                    </select>
                </div>

                <div class="elemento-formulario">
                    <label for="aula">Aula *:</label>
                    <input type="number" id="aula" name="aula" min="1" placeholder="Indica aquí el aula de la incidencia." required>
                </div>

                <div class="elemento-formulario">
                    <label for="fecha">Día de la incidencia *:</label>
                    <input type="week" id="fecha" name="fecha" required>
                </div>

                <div class="elemento-formulario">
                    <label for="hora">Hora de la incidencia *:</label>
                    <input type="time" id="hora" name="hora" required>
                </div>

                <div class="elemento-formulario">
                    <label for="descripcion">Descripción de la incidencia *:</label>
                    <textarea id="descripcion" name="descripcion" required></textarea>
                </div>

                <div class="elemento-formulario imagen">
                    <label for="imagen">Imagen de la incidencia (opcional):</label>
                    <input type="file" id="imagen" name="imagen" accept="image/*">
                </div>

                <div class="botones">
                    <button type="submit">Enviar incidencia</button>
                    <button type="reset">Borrar formulario</button>
                </div>
            </fieldset>
        </form>
    </main>

    <footer>
        <ul>
            <li>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener">
                    <img src="Imagenes/icons8-facebook-48.png" alt="Facebook del centro">
                </a>
            </li>
            <li>
                <a href="https://twitter.com/" target="_blank" rel="noopener">
                    <img src="Imagenes/icons8-twitter-48.png" alt="Twitter del centro">
                </a>
            </li>
            <li>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener">
                    <img src="Imagenes/icons8-instagram-48.png" alt="Instagram del centro">
                </a>
            </li>
            <li>
                <a href="https://www.youtube.com/" target="_blank" rel="noopener">
                    <img src="Imagenes/icons8-youtube-48.png" alt="Canal de YouTube del centro">
                </a>
            </li>
            <li>
                <a href="https://fpalanturing.es/" target="_blank" rel="noopener">
                    <img src="Imagenes/icons8-website-48.png" alt="Página web del centro">
                </a>
            </li>
        </ul>
    </footer>

</body>
</html>
